name: Physical iPhone and Watch build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physical-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed source archive
        run: unzip -oq FitAICoach-device-source.zip
      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build/device
      - name: Core tests and packaging guards
        run: |
          swift test
          python3 -m unittest discover -s Tests -p 'test_device_package.py' -v
      - name: Compile physical iPhone and embedded Watch apps
        run: |
          set -o pipefail
          xcodebuild -project FitAICoach.xcodeproj -scheme FitAICoach -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/Device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/device-build.log
      - name: Verify ARM64 device platforms and package unsigned IPA
        run: |
          python3 scripts/package_device.py build/Device/Build/Products/Release-iphoneos/FitAICoach.app build/device/UNSIGNED-DEVICE-FitAICoach.ipa
          printf '%s\n' 'Physical iOS/watchOS ARM64 build. UNSIGNED: requires Apple signing and device provisioning. This file is not ready to install.' > build/device/SIGNING-REQUIRED.txt
      - name: Save physical-device build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UNSIGNED-PHYSICAL-DEVICE-FitAICoach
          retention-days: 7
          path: |
            build/device
            build/device-build.log
            Config
