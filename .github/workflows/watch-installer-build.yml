name: Experimental Watch installer build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/watch-installer-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      PYTHONUTF8: '1'
    steps:
      - name: Fetch pinned public sources
        shell: pwsh
        run: |
          git clone https://github.com/Rzbck/iloader.git installer
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C installer checkout 70f37e9b4afc659ab44ec1944c034093f4cda416
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone https://github.com/Rzbck/isideload.git backend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C backend checkout f7b9f3da570edd6824c29680545e710846d07df5
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cargo-target
          key: watch-installer-windows-70f37e9-f7b9f3d-v1
      - name: Isolate experimental app storage
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('installer')
          config_path = root / 'src-tauri/tauri.conf.json'
          config = json.loads(config_path.read_text())
          config['identifier'] = 'local.fitai.watch-installer.experimental'
          config['productName'] = 'iloader Watch Experimental'
          config['app']['windows'][0]['title'] = 'iloader Watch Experimental - unofficial'
          config['plugins']['updater']['endpoints'] = []
          config['plugins']['updater']['pubkey'] = ''
          config['bundle']['createUpdaterArtifacts'] = False
          config_path.write_text(json.dumps(config, indent=2))
          for name in ('account.rs', 'secure_storage.rs'):
              path = root / 'src-tauri/src' / name
              path.write_text(path.read_text().replace('"iloader"', '"fitai-watch-installer-experimental"'))
          cargo_path = root / 'src-tauri/Cargo.toml'
          cargo_path.write_text('\n'.join(
              'isideload = { path = "../../backend/isideload", features = ["fs-storage"] }'
              if line.startswith('isideload = ') else line
              for line in cargo_path.read_text().splitlines()) + '\n')
          for path in (root / 'src').rglob('*.tsx'):
              text = path.read_text()
              updated = text.replace('["ani.sidestore.io", "SideStore (.io)"]', '["mac-ani.jkcoxson.com", "Jkcoxson (Mac)"]')
              updated = updated.replace('"ani.sidestore.io"', '"mac-ani.jkcoxson.com"')
              if updated != text:
                  path.write_text(updated)
          path = Path('backend/isideload/src/anisette/remote_v3/mod.rs')
          text = path.read_text()
          start = text.index('    async fn get_client_info(&self)')
          end = text.index('\n    fn needs_provisioning', start)
          replacement = '''    async fn get_client_info(&self) -> Result<AnisetteClientInfo, Report> {
                  let info = self.client
                      .get(format!("{}/v3/client_info", self.url))
                      .send().await
                      .context("Failed to request anisette client info")?
                      .error_for_status()
                      .context("Anisette client info status error")?
                      .json::<AnisetteClientInfo>().await
                      .context("Failed to parse anisette client info")?;
                  Ok(info)
              }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          Path('BUILD-INFO.txt').write_text(
              'UNOFFICIAL experimental Watch installer. Not endorsed by iloader maintainers.\n'
              'Official iloader: https://iloader.app / https://github.com/nab138/iloader\n'
              'Public Watch work: https://github.com/Rzbck/iloader-watch-companion\n'
              'App source: Rzbck/iloader@70f37e9b4afc659ab44ec1944c034093f4cda416\n'
              'Backend: Rzbck/isideload@f7b9f3da570edd6824c29680545e710846d07df5\n'
              'Local patches: separate app identifier/keyring namespace, explicit experimental title, no updater.\n'
              'Authentication compatibility: fetch /v3/client_info as in upstream main; default mac-ani.jkcoxson.com as in official iloader2.4.0.\n'
              'Backend uses the locally patched pinned source; resolved dependency lockfiles included.\n'
              'No Apple credentials, certificates, pairing data or health data supplied to this build.\n'
              'Build success is not proof of installation on the user device.\n')
      - name: Build prerequisites
        shell: pwsh
        run: choco install strawberryperl make --no-progress -y
      - name: Backend unit tests
        working-directory: backend
        run: cargo test -p isideload --lib
      - name: Frontend dependencies
        working-directory: installer
        run: bun install --frozen-lockfile
      - name: Build Windows executable without signing secrets
        working-directory: installer
        run: bunx tauri build --no-bundle
      - name: Package reviewable result
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force
          Copy-Item cargo-target/release/iloader.exe artifact/iloader-watch-experimental.exe
          Copy-Item BUILD-INFO.txt artifact/
          Copy-Item installer/LICENSE artifact/LICENSE-iloader.txt
          Copy-Item installer/LICENSE-BRANDING artifact/
          Copy-Item backend/LICENSE artifact/LICENSE-isideload.txt
          Copy-Item backend/Cargo.lock artifact/backend-Cargo.lock
          Copy-Item installer/src-tauri/Cargo.lock artifact/installer-Cargo.lock
          git -C installer diff --binary | Out-File artifact/installer-changes.patch -Encoding utf8
          git -C backend diff --binary | Out-File artifact/backend-changes.patch -Encoding utf8
          Get-FileHash artifact/iloader-watch-experimental.exe -Algorithm SHA256 | Format-List | Out-File artifact/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UNOFFICIAL-WATCH-INSTALLER-REVIEW
          path: artifact
          retention-days: 7
